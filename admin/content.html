<!DOCTYPE html>
<html lang="zh-Hant-TW"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>網站內容｜竹縣少代後台</title>
  <link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/print.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><script defer src="/js/env.js"></script><script defer src="/js/config.js"></script><script defer src="/js/data.js"></script><script defer src="/js/content-config.js"></script><script defer src="/js/data-service.js"></script><script defer src="/js/common.js"></script><script defer src="/js/admin-common.js"></script><script defer src="/js/admin-content.js"></script><script defer src="/js/admin-team.js"></script>
</head><body class="admin-body"><div class="admin-app">
  <aside class="admin-sidebar" data-admin-sidebar aria-label="管理後台側欄"><a class="brand" href="/admin/dashboard.html"><span class="brand__mark">少代</span><span class="brand__text"><strong>網站管理後台</strong><small>HCCCR Admin</small></span></a><nav class="admin-nav" aria-label="後台主要導覽"><span class="admin-nav__label">工作區</span><a href="/admin/dashboard.html"><i data-lucide="layout-dashboard"></i> 調查總覽</a><a href="/admin/builder.html"><i data-lucide="list-plus"></i> 建立調查</a><span class="admin-nav__label">網站</span><a href="/surveys" target="_blank"><i data-lucide="external-link"></i> 開啟前台</a></nav><div class="admin-sidebar__footer admin-nav"><button type="button" data-sign-out><i data-lucide="log-out"></i> 登出</button></div></aside>
  <div class="admin-scrim" data-admin-scrim></div>
  <main class="admin-main"><header class="admin-topbar"><div class="admin-topbar__title"><button class="icon-button admin-mobile-toggle" type="button" data-admin-menu aria-expanded="false"><i data-lucide="menu"></i><span class="sr-only">開啟導覽</span></button><h1>網站內容</h1></div><div class="admin-topbar__actions"><a class="icon-button" href="/" target="_blank" title="預覽網站"><i data-lucide="eye"></i><span class="sr-only">預覽網站</span></a><button class="button button--small" type="submit" form="content-form" data-save-content><i data-lucide="save"></i><span class="admin-action-label">儲存</span></button></div></header>
    <div class="admin-content"><div class="notice notice--demo" data-demo-only hidden><i data-lucide="flask-conical"></i><p>示範模式的修改只保留在目前瀏覽器分頁。</p></div><div class="admin-page-heading"><div><h2>內容編輯器</h2><p>管理首頁、聯絡頁與隱私權條款文字。</p></div></div>
      <div class="segmented-control content-tabs" data-content-tabs role="tablist" aria-label="內容頁面"></div>
      <form id="content-form" data-content-form novalidate><div data-content-panels><section class="panel"><div class="panel__body">正在載入…</div></section></div></form>

      <div class="admin-page-heading admin-page-heading--secondary"><div><h2>代表名單管理</h2><p>管理「認識我們」頁面顯示的代表卡片，新增、編輯或調整排序後記得儲存。</p></div><button class="button button--small" type="button" data-add-member><i data-lucide="user-plus"></i> 新增代表</button></div>
      <div class="panel"><div class="panel__body"><div class="team-editor" data-team-editor><p class="empty-state">正在載入…</p></div></div></div>
    </div>
  </main>
</div>
<div class="dialog-scrim" data-member-dialog hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="member-dialog-title">
    <div class="dialog__header"><h2 id="member-dialog-title">編輯代表</h2><button class="icon-button" type="button" data-close-member><i data-lucide="x"></i><span class="sr-only">關閉</span></button></div>
    <form class="dialog__body" data-member-form>
      <label class="form-label">姓名或稱呼<input class="form-control" name="name" type="text" maxlength="60" required></label>
      <label class="form-label">屆別／職稱<input class="form-control" name="role" type="text" maxlength="60" placeholder="例：第四屆兒少諮詢代表"></label>
      <label class="form-label">關注議題<input class="form-control" name="focus" type="text" maxlength="80" placeholder="例：校園霸凌、交通安全"></label>
      <label class="form-label">完整介紹<textarea class="form-control" name="bio" rows="6" maxlength="2000" placeholder="可寫下代表的關注、經驗與想對大家說的話。"></textarea></label>
      <label class="form-label">代表照片（選填）<input class="form-control" name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <p class="dialog__hint">直接選擇照片上傳（JPG、PNG、WebP，5MB 以下）。照片會安全儲存在網站專用的 Supabase Storage。</p>
      <div class="dialog__actions"><button class="button button--secondary button--small" type="button" data-close-member>取消</button><button class="button button--small" type="submit"><i data-lucide="check"></i> 儲存代表</button></div>
    </form>
  </div>
</div>
</body></html>
