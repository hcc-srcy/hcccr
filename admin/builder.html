<!DOCTYPE html>
<html lang="zh-Hant-TW"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>表單建構器｜竹縣少代後台</title>
  <link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/print.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><script defer src="/js/env.js"></script><script defer src="/js/config.js"></script><script defer src="/js/data.js"></script><script defer src="/js/data-service.js"></script><script defer src="/js/common.js"></script><script defer src="/js/admin-common.js"></script><script defer src="/js/builder.js"></script>
</head><body class="admin-body"><div class="admin-app">
  <aside class="admin-sidebar" data-admin-sidebar aria-label="管理後台側欄"><a class="brand" href="/admin/dashboard.html"><span class="brand__mark">少代</span><span class="brand__text"><strong>調查管理後台</strong><small>Survey Admin</small></span></a><nav class="admin-nav" aria-label="後台主要導覽"><span class="admin-nav__label">工作區</span><a href="/admin/dashboard.html"><i data-lucide="layout-dashboard"></i> 調查總覽</a><a href="/admin/builder.html" aria-current="page"><i data-lucide="list-plus"></i> 建立調查</a><span class="admin-nav__label">網站</span><a href="/surveys" target="_blank"><i data-lucide="external-link"></i> 開啟前台</a></nav><div class="admin-sidebar__footer admin-nav"><button type="button" data-sign-out><i data-lucide="log-out"></i> 登出</button></div></aside>
  <div class="admin-scrim" data-admin-scrim></div>
  <main class="admin-main"><header class="admin-topbar"><div class="admin-topbar__title"><button class="icon-button admin-mobile-toggle" type="button" data-admin-menu aria-expanded="false"><i data-lucide="menu"></i><span class="sr-only">開啟導覽</span></button><h1 data-builder-title>建立調查</h1></div><div class="admin-topbar__actions"><button class="icon-button" type="button" data-print-form title="列印空白問卷" disabled><i data-lucide="printer"></i><span class="sr-only">列印空白問卷</span></button><a class="button button--secondary button--small" data-preview-link href="/survey-detail.html" target="_blank" title="預覽問卷"><i data-lucide="eye"></i><span class="admin-action-label">預覽</span><span class="sr-only">問卷</span></a><button class="button button--small" type="submit" form="builder-form" data-save-form title="儲存調查"><i data-lucide="save"></i><span class="admin-action-label">儲存</span><span class="sr-only">調查</span></button></div></header>
    <div class="admin-content"><div class="admin-page-heading"><div><h2>表單建構器</h2><p>設定調查基本資料、存取權限及題目順序。</p></div></div><div class="builder-layout">
      <form class="builder-main" id="builder-form" data-builder-form novalidate>
        <section class="panel"><div class="panel__header"><h3>基本資料</h3></div><div class="panel__body"><div class="settings-grid"><label class="form-label span-2">調查名稱<input class="form-control" name="title" type="text" required placeholder="輸入調查名稱"></label><label class="form-label span-2">說明<textarea class="form-control" name="description" required placeholder="簡短說明調查目的與填答對象"></textarea></label><label class="form-label">議題分類<input class="form-control" name="category" type="text" placeholder="例如：學習權益"></label><label class="form-label">固定網址代碼<input class="form-control" name="slug" type="text" pattern="[a-z0-9-]+" placeholder="survey-name-2026"></label><label class="form-label">開始時間<input class="form-control" name="start_date" type="datetime-local"></label><label class="form-label">截止時間<input class="form-control" name="end_date" type="datetime-local"></label></div></div></section>
        <section><div class="panel__header panel__header--plain"><h3>題目 <span class="tag" data-field-count>0 題</span></h3></div><div class="field-list" data-field-list></div><div class="add-field-bar"><select class="form-control" data-new-field-type aria-label="新增題型"><option value="radio">單選題</option><option value="checkbox">複選題</option><option value="text">簡答題</option><option value="textarea">長答題</option><option value="date">日期</option></select><button class="button button--secondary button--small" type="button" data-add-field><i data-lucide="plus"></i> 新增題目</button></div></section>
      </form>
      <aside class="builder-sidebar" aria-label="發布與分享設定">
        <section class="panel"><div class="panel__header"><h3>發布設定</h3></div><div class="panel__body"><label class="form-label">存取權限<select class="form-control" name="visibility" form="builder-form" data-visibility><option value="public">公開</option><option value="public_password">公開但需密碼</option><option value="unlisted">不公開連結</option></select></label><label class="form-label form-label--spaced" data-password-setting hidden>活動密碼<input class="form-control" type="text" data-access-password autocomplete="off"></label><div class="settings-stack"><div class="toggle-row"><div><strong>開放填寫</strong><small>關閉後前台不可送出</small></div><label class="switch"><input type="checkbox" data-is-open checked><span></span></label></div><div class="toggle-row"><div><strong>要求條款同意</strong><small>同意時開始計時</small></div><label class="switch"><input type="checkbox" data-require-consent checked><span></span></label></div></div></div></section>
        <section class="panel"><div class="panel__header"><h3>固定網址與 QR Code</h3></div><div class="panel__body"><div class="url-box"><input class="form-control" type="text" data-fixed-url readonly aria-label="調查固定網址"><button class="icon-button" type="button" data-copy-url title="複製網址"><i data-lucide="copy"></i><span class="sr-only">複製網址</span></button></div><div class="qr-preview"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-qr-image alt="調查固定網址 QR Code"></div><a class="button button--secondary button--small button--full" href="#" data-download-qr target="_blank" rel="noopener"><i data-lucide="download"></i> 開啟 QR Code</a></div></section>
      </aside>
    </div></div>
  </main>
</div></body></html>
