<!DOCTYPE html>
<html lang="zh-Hant-TW"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>收件匣｜竹縣少代後台</title>
  <link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/print.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><script defer src="/js/env.js"></script><script defer src="/js/config.js"></script><script defer src="/js/data.js"></script><script defer src="/js/content-config.js"></script><script defer src="/js/data-service.js"></script><script defer src="/js/common.js"></script><script defer src="/js/admin-common.js"></script><script defer src="/js/admin-inbox.js"></script>
</head><body class="admin-body"><div class="admin-app">
  <aside class="admin-sidebar" data-admin-sidebar aria-label="管理後台側欄"><a class="brand" href="/admin/dashboard.html"><span class="brand__mark">少代</span><span class="brand__text"><strong>網站管理後台</strong><small>HCCCR Admin</small></span></a><nav class="admin-nav" aria-label="後台主要導覽"><span class="admin-nav__label">工作區</span><a href="/admin/dashboard.html"><i data-lucide="layout-dashboard"></i> 調查總覽</a><a href="/admin/builder.html"><i data-lucide="list-plus"></i> 建立調查</a><span class="admin-nav__label">網站</span><a href="/surveys" target="_blank"><i data-lucide="external-link"></i> 開啟前台</a></nav><div class="admin-sidebar__footer admin-nav"><button type="button" data-sign-out><i data-lucide="log-out"></i> 登出</button></div></aside>
  <div class="admin-scrim" data-admin-scrim></div>
  <main class="admin-main"><header class="admin-topbar"><div class="admin-topbar__title"><button class="icon-button admin-mobile-toggle" type="button" data-admin-menu aria-expanded="false"><i data-lucide="menu"></i><span class="sr-only">開啟導覽</span></button><h1>收件匣</h1></div><div class="admin-topbar__actions"><button class="icon-button" type="button" data-refresh-inbox title="重新整理"><i data-lucide="refresh-cw"></i><span class="sr-only">重新整理收件匣</span></button><button class="button button--small" type="button" data-open-compose><i data-lucide="pencil"></i> 主動發訊息</button></div></header>
    <div class="admin-content"><div class="notice notice--demo" data-demo-only hidden><i data-lucide="flask-conical"></i><p>示範模式的聯絡訊息只保留在目前瀏覽器分頁。</p></div><div class="admin-page-heading"><div><h2>聯絡訊息</h2><p>處理網站聯絡表單來信，也可以主動發起訊息給特定對象並持續往返對話。</p></div></div><div class="kpi-strip" data-inbox-kpis></div>
      <div class="toolbar inbox-toolbar"><div class="toolbar__group"><label class="sr-only" for="message-status-filter">訊息狀態</label><select class="form-control" id="message-status-filter" data-message-filter><option value="active">未封存</option><option value="unread">待處理</option><option value="read">已讀</option><option value="replied">等待對方回覆</option><option value="archived">已封存</option><option value="all">全部</option></select><label class="sr-only" for="message-origin-filter">訊息來源</label><select class="form-control" id="message-origin-filter" data-message-origin-filter><option value="all">所有來源</option><option value="contact_form">聯絡表單</option><option value="admin_initiated">主動發起</option></select></div><span class="tag" data-message-count>0 封</span></div>
      <div class="inbox-layout"><section class="panel" aria-label="聯絡訊息清單"><div class="table-wrap"><table class="data-table inbox-table"><thead><tr><th scope="col">對象</th><th scope="col">主旨</th><th scope="col">最後互動</th><th scope="col">狀態</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead><tbody data-message-list><tr><td colspan="5">正在載入…</td></tr></tbody></table></div></section><aside class="panel inbox-detail" aria-label="對話內容" data-message-detail><div class="empty-state">選擇一封訊息查看對話內容。</div></aside></div>
    </div>
  </main>
</div>
<div class="dialog-scrim" data-compose-dialog hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="compose-dialog-title">
    <div class="dialog__header"><h2 id="compose-dialog-title">主動發起訊息</h2><button class="icon-button" type="button" data-close-compose><i data-lucide="x"></i><span class="sr-only">關閉</span></button></div>
    <form class="dialog__body" data-compose-form>
      <p class="dialog__hint">建立後會產生一組專屬對話連結，請透過 Email、LINE 或其他管道將連結交給對方，對方不需要註冊帳號即可查看並回覆。</p>
      <label class="form-label">收件人稱呼<input class="form-control" name="sender_name" type="text" maxlength="80" required></label>
      <label class="form-label">收件人 Email<input class="form-control" name="sender_email" type="email" maxlength="254" required></label>
      <label class="form-label">主旨<input class="form-control" name="subject" type="text" maxlength="120" required></label>
      <label class="form-label">訊息內容<textarea class="form-control" name="message" minlength="10" maxlength="5000" rows="6" required></textarea></label>
      <p class="field-message" data-compose-error role="alert"></p>
      <div class="dialog__actions"><button class="button button--secondary button--small" type="button" data-close-compose>取消</button><button class="button button--small" type="submit"><i data-lucide="send"></i> 建立並產生連結</button></div>
    </form>
  </div>
</div>
</body></html>
